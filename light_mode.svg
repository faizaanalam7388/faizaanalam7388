<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f6f8fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bgGradientLight)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="50" r="40" fill="#eaeef2" opacity="0.8"/>
  <circle cx="700" cy="350" r="60" fill="#eaeef2" opacity="0.6"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="760" height="360" fill="none" stroke="#d0d7de" stroke-width="2" rx="10"/>
  
  <!-- Header -->
  <text x="50" y="80" font-size="48" font-weight="bold" fill="#24292f" font-family="Arial, sans-serif">
    👋 Hi, I'm Faizaan Alam
  </text>
  
  <!-- Subtitle -->
  <text x="50" y="130" font-size="20" fill="#57606a" font-family="Arial, sans-serif">
    💻 Full-Stack Developer | 🚀 Open Source Enthusiast
  </text>
  
  <!-- Info lines -->
  <text x="50" y="170" font-size="16" fill="#24292f" font-family="Arial, sans-serif">
    🎓 Computer Science & Engineering Student
  </text>
  
  <text x="50" y="200" font-size="16" fill="#24292f" font-family="Arial, sans-serif">
    🌱 Learning: C++, Java, JavaScript & Full-Stack Development
  </text>
  
  <text x="50" y="230" font-size="16" fill="#24292f" font-family="Arial, sans-serif">
    🤝 Open to collaborating on Web Development & Open Source
  </text>
  
  <!-- Contact info -->
  <text x="50" y="280" font-size="14" fill="#57606a" font-family="Arial, sans-serif">
    📧 faizaanalam1980@gmail.com
  </text>
  
  <!-- Tech stack tags -->
  <g>
    <!-- JavaScript -->
    <rect x="50" y="310" width="90" height="30" fill="#f7df1e" rx="5"/>
    <text x="95" y="332" font-size="12" font-weight="bold" fill="#000" text-anchor="middle" font-family="Arial, sans-serif">JavaScript</text>
    
    <!-- React -->
    <rect x="150" y="310" width="70" height="30" fill="#0ea5e9" rx="5"/>
    <text x="185" y="332" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">React</text>
    
    <!-- Node.js -->
    <rect x="230" y="310" width="70" height="30" fill="#339933" rx="5"/>
    <text x="265" y="332" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Node.js</text>
    
    <!-- MongoDB -->
    <rect x="310" y="310" width="80" height="30" fill="#13aa52" rx="5"/>
    <text x="350" y="332" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">MongoDB</text>
  </g>
  
  <!-- Footer -->
  <text x="400" y="380" font-size="12" fill="#57606a" text-anchor="middle" font-family="Arial, sans-serif">
    ⭐ Let's connect and build something amazing together!
  </text>
</svg>